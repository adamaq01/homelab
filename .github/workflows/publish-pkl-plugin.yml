name: Publish ArgoCD Pkl CMP plugin

on:
  push:
    branches: [main]
    paths:
      - k8s/apps/argocd/plugin/**
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tag is PKL_VERSION, not per-build — any push under plugin/** republishes under this
      # same tag even when only plugin.pkl's content changed, not just when PKL_VERSION bumps.
      # See the imagePullPolicy: Always note in deployment-argocd-repo-server.pkl.
      - name: Read PKL_VERSION from Dockerfile
        id: version
        run: |
          version=$(grep -oP '^ARG PKL_VERSION=\K.*' k8s/apps/argocd/plugin/Dockerfile)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: k8s/apps/argocd/plugin
          push: true
          tags: ghcr.io/${{ github.repository }}/pkl-plugin:${{ steps.version.outputs.version }}
